name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  node-tests:
    name: Node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Expose PostgreSQL server tools
        run: |
          for initdb in /usr/lib/postgresql/*/bin/initdb; do
            if [ -x "$initdb" ] && [ -x "${initdb%/initdb}/pg_ctl" ]; then
              printf '%s\n' "${initdb%/initdb}" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          echo 'PostgreSQL server tools (initdb and pg_ctl) are required' >&2
          exit 1
      - run: npm test
  browser-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: PLAYWRIGHT_BROWSERS_PATH=.cache/ms-playwright npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
      - name: Retain failed browser diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/**/trace.zip
            test-results/**/error-context.md
          if-no-files-found: warn
          retention-days: 7
  release:
    name: Version release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.created
    needs: [node-tests, browser-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node scripts/release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
